version: 1
schedule:
  timezone: Africa/Johannesburg
  time: "05:00"
selection:
  priorities: [dependency-vulnerability, property-testing, static-analysis, maintainability]
analysis:
  php:
    complexity_tool: auto
    duplicate_code_tool: auto
    slow_test_threshold_ms: 500
    slow_query:
      mechanism: off
      threshold_ms: 100
limits:
  max_changed_files: 5
  max_diff_lines: 250
  max_open_prs: 3
  max_cost_usd: 5
protected_paths:
  - .github/**
  - .ai/improver.yml
  - .ai/policies/**
  - .ai/runs/**/spec.json
  - database/migrations/**
  - packages/**
  - tests/**
verification:
  commands:
    - composer validate --strict --no-interaction
    - composer lint:check
    - composer phpstan
    - php artisan test
  mutation_testing: off
pull_request:
  draft: true
  labels: [ai-improvement]
